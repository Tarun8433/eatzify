services:
  postgres:
    image: postgres:17.9-alpine
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - boilerplate-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # The api waits on this instead of a wait-for-it wrapper script (D-159).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Uncomment to use redis
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - 6379:6379

  # Exercise animations (D-243). The files live on the host and are mounted read-only — never in
  # the image and never in git: they are © Gym visual and licensed separately, so a deployment
  # without them simply has no media and the app falls back to icons.
  media:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - ${GYM_MEDIA_PORT:-3003}:80
    volumes:
      - ${GYM_MEDIA_DIR:-./media}:/usr/share/nginx/html:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${APP_PORT}:${APP_PORT}
    env_file: .env
    # The food photographs live on disk, git-tracked, and .dockerignore keeps them out of the
    # image — the container reads them from the checkout instead (D-159).
    volumes:
      - ./files:/usr/src/app/files
    depends_on:
      postgres:
        condition: service_healthy

  # The admin dashboard (admin panel plan, Phase A). Behind the `admin` profile, so the routine
  # `docker compose up -d --build` of an API deploy never builds it. Start it with:
  #   docker compose --profile admin up -d --build admin
  admin:
    profiles: ['admin']
    build:
      context: ../admin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - ${ADMIN_PORT:-3004}:3000
    environment:
      ADMIN_API_URL: http://api:${APP_PORT}/api/v1
    depends_on:
      - api

volumes:
  boilerplate-db:
