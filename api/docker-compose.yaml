services:
  postgres:
    image: postgres:17.9-alpine
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - boilerplate-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # The api waits on this instead of a wait-for-it wrapper script (D-159).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Uncomment to use redis
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - 6379:6379

  # Exercise animations (D-243). The files live on the host and are mounted read-only — never in
  # the image and never in git: they are © Gym visual and licensed separately, so a deployment
  # without them simply has no media and the app falls back to icons.
  media:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - ${GYM_MEDIA_PORT:-3003}:80
    volumes:
      - ${GYM_MEDIA_DIR:-./media}:/usr/share/nginx/html:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${APP_PORT}:${APP_PORT}
    env_file: .env
    # The food photographs live on disk, git-tracked, and .dockerignore keeps them out of the
    # image — the container reads them from the checkout instead (D-159).
    volumes:
      - ./files:/usr/src/app/files
    depends_on:
      postgres:
        condition: service_healthy

  # HTTPS for the website, the API and media. Caddy obtains and renews the certificates itself;
  # its data volume keeps them across restarts so a redeploy does not re-request them.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SITE_DIR:-../site}:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  boilerplate-db:
  caddy-data:
  caddy-config:
