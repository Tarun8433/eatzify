# Host nginx (installed on the server, outside Docker) — the public front door.
#
# COPY this file into nginx; never symlink it. certbot writes the HTTPS blocks into the file it is
# given, and each deploy resets /opt/eatzify to the repo, so a symlinked repo file would lose its
# HTTPS config on the next push.
#
# Install:  cp /opt/eatzify/api/deploy/nginx/eatzify.conf /etc/nginx/sites-available/eatzify.conf
#           ln -sf /etc/nginx/sites-available/eatzify.conf /etc/nginx/sites-enabled/eatzify.conf
#           nginx -t && systemctl reload nginx
# HTTPS:    certbot --nginx -d eatzify.zynthovo.com -d eatzify-api.zynthovo.com -d eatzify-media.zynthovo.com
#           certbot --nginx -d eatzify-admin.zynthovo.com   (admin dashboard, once its DNS exists)
#
# This server also hosts other live sites: always run `nginx -t` before a reload.

# The website: Terms, Privacy, Refunds, Contact, pricing. Served straight from the repo checkout,
# so a deploy updates it with no upload step.
server {
    listen 80;
    listen [::]:80;
    server_name eatzify.zynthovo.com;

    root /opt/eatzify/site;
    index index.html;

    # /privacy and /privacy/ both work: the app and the Play listing use either.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

# The API. HTTPS here is what iOS requires and what Cashfree's webhook needs.
server {
    listen 80;
    listen [::]:80;
    server_name eatzify-api.zynthovo.com;

    # Meal photos are uploaded through the API.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The coach chat is a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Exercise media (only used once GYM_MEDIA_BASE_URL points here).
server {
    listen 80;
    listen [::]:80;
    server_name eatzify-media.zynthovo.com;

    location / {
        proxy_pass http://127.0.0.1:3003;
    }
}

# The admin dashboard (admin panel plan, Phase A). Its session cookie is `secure` in production,
# so it only signs in over HTTPS: run certbot for this name before using it.
server {
    listen 80;
    listen [::]:80;
    server_name eatzify-admin.zynthovo.com;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
