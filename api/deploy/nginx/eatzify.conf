# Host nginx (installed on the server, outside Docker) — the public front door.
# Install:  ln -s /opt/eatzify/api/deploy/nginx/eatzify.conf /etc/nginx/sites-enabled/eatzify.conf
# HTTPS:    certbot --nginx -d eatzify.app -d www.eatzify.app -d api.eatzify.app -d media.eatzify.app
# certbot then adds the 443 blocks and the http→https redirects to this file itself.

# The website: Terms, Privacy, Refunds, Contact, pricing. Served straight from the repo checkout,
# so a deploy updates it with no upload step.
server {
    listen 80;
    listen [::]:80;
    server_name eatzify.app www.eatzify.app;

    root /opt/eatzify/site;
    index index.html;

    # /privacy and /privacy/ both work: the app and the Play listing use either.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

# The API. HTTPS here is what iOS requires and what Cashfree's webhook needs.
server {
    listen 80;
    listen [::]:80;
    server_name api.eatzify.app;

    # Meal photos are uploaded through the API.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The coach chat is a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Exercise media (only used once GYM_MEDIA_BASE_URL points here).
server {
    listen 80;
    listen [::]:80;
    server_name media.eatzify.app;

    location / {
        proxy_pass http://127.0.0.1:3003;
    }
}
